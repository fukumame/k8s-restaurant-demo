apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-info
  namespace: default
spec:
  selector:
    matchLabels:
      app: node-info
  template:
    metadata:
      labels:
        app: node-info
    spec:
      containers:
        - name: node-info
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "This is node: $(hostname)"
              echo "DaemonSet pod is running on this node"
              sleep 3600
