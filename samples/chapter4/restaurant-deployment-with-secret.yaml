apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-demo-deploy
  labels:
    app: restaurant-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: restaurant-demo
  template:
    metadata:
      labels:
        app: restaurant-demo
    spec:
      containers:
        - name: restaurant-demo
          image: docker.io/fukumame/k8s-restaurant-demo:secret_recipe
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: restaurant-config
            - secretRef:
                name: restaurant-secret
