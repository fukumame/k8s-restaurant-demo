apiVersion: batch/v1
kind: CronJob
metadata:
  name: inventory-check
  namespace: default
spec:
  schedule: "*/1 * * * *"  # 1分ごとに実行
  successfulJobsHistoryLimit: 3  # 成功したJobの履歴を3つ保持
  failedJobsHistoryLimit: 1      # 失敗したJobの履歴を1つ保持
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: inventory-check
              image: busybox:1.36
              resources:
                requests:        # スケジューリング時に確保される最低限のリソース
                  cpu: "10m"
                  memory: "16Mi"
                limits:          # 使用量の上限。CPU は使用量が上限までに制限される（動作が遅くなるだけ）が、メモリは超えるとコンテナが強制終了される
                  cpu: "50m"
                  memory: "32Mi"
              command:
                - sh
                - -c
                - |
                  echo "Inventory check started at $(date)"
                  echo "Checking stock levels..."
                  echo "Stock check completed at $(date)"
          restartPolicy: OnFailure
